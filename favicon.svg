<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Ink navy rounded background -->
  <rect width="256" height="256" rx="48" fill="#101B2D"/>

  <!-- Ledger page: a simple rectangle with ruled lines, like a page in the app -->
  <rect x="64" y="52" width="128" height="152" rx="6" fill="#EFEAE0"/>

  <!-- Ruled lines on the page -->
  <line x1="80" y1="88" x2="176" y2="88" stroke="#D8D2C2" stroke-width="4"/>
  <line x1="80" y1="112" x2="176" y2="112" stroke="#D8D2C2" stroke-width="4"/>
  <line x1="80" y1="136" x2="152" y2="136" stroke="#D8D2C2" stroke-width="4"/>

  <!-- Gold rupee mark as the accent, bottom-right, like a wax-seal ledger tab -->
  <circle cx="180" cy="180" r="40" fill="#B98F3D"/>
  <text x="180" y="196" font-family="Georgia, serif" font-size="44" font-weight="600" fill="#101B2D" text-anchor="middle">₹</text>
</svg>
